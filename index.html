<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyushBrief — Daily Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0e;
  --surface: #141416;
  --surface2: #1c1c20;
  --border: #252528;
  --text: #e8e4dc;
  --text-dim: #5a5760;
  --text-mid: #9a9298;
  --gold: #d4a843;
  --gold-dim: #7a5f20;
  --tech: #4a9eff;
  --world: #ff6b6b;
  --health: #4ecb8d;
  --india: #ff9f43;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Subtle noise */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 999;
}

/* HEADER */
header {
  padding: 1.8rem 2.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(12,12,14,0.95);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.03em;
}

.logo span { color: var(--gold); }

.header-right {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--health);
}

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--health);
  animation: blink 2s infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.date {
  font-size: 0.7rem;
  color: var(--text-dim);
}

/* STATS BAR */
.stats-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

.stat-item {
  padding: 1rem 2.5rem;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}

.stat-label {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.3rem;
}

.stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  color: var(--gold);
  line-height: 1;
}

/* MAIN */
main { padding: 2rem 2.5rem; max-width: 1300px; margin: 0 auto; }

/* CATEGORY SECTION */
.cat-section {
  margin-bottom: 3rem;
  opacity: 0;
  animation: fadeUp 0.5s ease forwards;
}

.cat-section:nth-child(1) { animation-delay: 0.1s; }
.cat-section:nth-child(2) { animation-delay: 0.2s; }
.cat-section:nth-child(3) { animation-delay: 0.3s; }
.cat-section:nth-child(4) { animation-delay: 0.4s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.cat-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.2rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--border);
}

.cat-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
}

.cat-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.cat-count {
  font-size: 0.65rem;
  color: var(--text-dim);
  margin-left: auto;
  letter-spacing: 0.1em;
}

/* 3+2 GRID */
.card-grid-top {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  margin-bottom: 1px;
}

.card-grid-bottom {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
}

/* NEWS CARD */
.news-card {
  background: var(--surface);
  padding: 1.4rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
  position: relative;
  overflow: hidden;
}

.news-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 0;
  transition: height 0.3s ease;
}

.news-card:hover { background: var(--surface2); }
.news-card:hover::before { height: 100%; }

.card-num {
  font-size: 0.55rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  margin-bottom: 0.6rem;
}

.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 0.6rem;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-summary {
  font-size: 0.7rem;
  color: var(--text-mid);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  margin-top: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-source {
  font-size: 0.55rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.card-arrow {
  font-size: 0.8rem;
  color: var(--text-dim);
  transition: transform 0.2s, color 0.2s;
}

.news-card:hover .card-arrow {
  transform: translateX(4px);
}

/* Color theming per category */
.cat-tech .cat-dot { background: var(--tech); }
.cat-tech .cat-title { color: var(--tech); }
.cat-tech .news-card::before { background: var(--tech); }
.cat-tech .news-card:hover .card-arrow { color: var(--tech); }

.cat-world .cat-dot { background: var(--world); }
.cat-world .cat-title { color: var(--world); }
.cat-world .news-card::before { background: var(--world); }
.cat-world .news-card:hover .card-arrow { color: var(--world); }

.cat-health .cat-dot { background: var(--health); }
.cat-health .cat-title { color: var(--health); }
.cat-health .news-card::before { background: var(--health); }
.cat-health .news-card:hover .card-arrow { color: var(--health); }

.cat-india .cat-dot { background: var(--india); }
.cat-india .cat-title { color: var(--india); }
.cat-india .news-card::before { background: var(--india); }
.cat-india .news-card:hover .card-arrow { color: var(--india); }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--surface2);
  border: 1px solid var(--border);
  max-width: 680px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(20px) scale(0.97);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal {
  transform: translateY(0) scale(1);
}

.modal-top {
  height: 4px;
}

.modal-body {
  padding: 2rem;
}

.modal-cat {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 900;
  line-height: 1.3;
  margin-bottom: 1.2rem;
  letter-spacing: -0.02em;
}

.modal-summary {
  font-size: 0.85rem;
  line-height: 1.8;
  color: var(--text-mid);
  margin-bottom: 1.5rem;
}

.modal-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 1.2rem;
  border-top: 1px solid var(--border);
}

.modal-source {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.modal-actions {
  display: flex;
  gap: 0.8rem;
}

.btn-read {
  padding: 0.6rem 1.2rem;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--gold);
  color: #000;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  transition: opacity 0.2s;
}

.btn-read:hover { opacity: 0.85; }

.btn-close {
  padding: 0.6rem 1.2rem;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: border-color 0.2s, color 0.2s;
}

.btn-close:hover { border-color: var(--text-dim); color: var(--text); }

/* EMPTY */
.empty-section {
  background: var(--surface);
  padding: 3rem;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 1.2rem 2.5rem;
  display: flex;
  justify-content: space-between;
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

@media (max-width: 768px) {
  header { padding: 1.2rem 1.2rem; }
  main { padding: 1.2rem; }
  .stat-item { padding: 0.8rem 1.2rem; }
  .card-grid-top { grid-template-columns: 1fr; }
  .card-grid-bottom { grid-template-columns: 1fr; }
  .modal-title { font-size: 1.2rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Ayush<span>Brief.</span></div>
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div>Live</div>
    <div class="date" id="dateEl">—</div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-label">Stories</div>
    <div class="stat-val" id="statTotal">—</div>
  </div>
  <div class="stat-item">
    <div class="stat-label">Categories</div>
    <div class="stat-val">4</div>
  </div>
  <div class="stat-item">
    <div class="stat-label">Generated</div>
    <div class="stat-val" style="font-size:0.9rem;padding-top:0.3rem">06:00 IST</div>
  </div>
  <div class="stat-item">
    <div class="stat-label">Engine</div>
    <div class="stat-val" style="font-size:0.9rem;padding-top:0.3rem">Groq AI</div>
  </div>
</div>

<main id="main"></main>

<footer>
  <span>AyushBrief — Daily Intelligence</span>
  <span>Runs 6:00 AM IST · Built by Ayush Bansal</span>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-top" id="modalTop"></div>
    <div class="modal-body">
      <div class="modal-cat" id="modalCat"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-summary" id="modalSummary"></div>
      <div class="modal-footer">
        <span class="modal-source" id="modalSource"></span>
        <div class="modal-actions">
          <button class="btn-close" onclick="closeModalBtn()">Close</button>
          <button class="btn-read" id="modalReadBtn" onclick="openSource()">Read Full →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CATEGORIES = [
  { key: 'tech',   label: 'Tech & AI',       color: '#4a9eff', cls: 'cat-tech'   },
  { key: 'world',  label: 'World News',       color: '#ff6b6b', cls: 'cat-world'  },
  { key: 'health', label: 'Healthcare',       color: '#4ecb8d', cls: 'cat-health' },
  { key: 'india',  label: 'India Business',   color: '#ff9f43', cls: 'cat-india'  },
];

let currentUrl = '';

// Date
document.getElementById('dateEl').textContent = new Date().toLocaleDateString('en-IN', {
  weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
});

function detectCategory(story) {
  const t = (story.title + ' ' + (story.summary || '') + ' ' + (story.source || '')).toLowerCase();
  if (/health|pharma|medic|hospital|drug|vaccine|disease|patient|clinical|who |ebola|pandemic/.test(t)) return 'health';
  if (/india|delhi|mumbai|modi|bjp|rupee|sensex|nifty|livemint|sebi|rbi/.test(t)) return 'india';
  if (/tech|ai|apple|google|microsoft|software|startup|gadget|openai|meta |amazon|nvidia|cyber/.test(t)) return 'tech';
  return 'world';
}

function openModal(story, catColor, catLabel) {
  currentUrl = story.url || '';
  document.getElementById('modalTop').style.background = catColor;
  document.getElementById('modalCat').innerHTML = `<span style="color:${catColor}">●</span> <span style="color:${catColor}">${catLabel}</span>`;
  document.getElementById('modalTitle').textContent = story.title || '';
  document.getElementById('modalSummary').textContent = story.summary || story.description || 'No summary available.';
  document.getElementById('modalSource').textContent = story.source || '';
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}

function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

function openSource() {
  if (currentUrl) window.open(currentUrl, '_blank');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });

function buildSection(cat, stories) {
  const top3 = stories.slice(0, 3);
  const bot2 = stories.slice(3, 5);

  const cardHTML = (story, idx, totalIdx) => `
    <div class="news-card" onclick='openModal(${JSON.stringify(story).replace(/'/g,"&#39;")}, "${cat.color}", "${cat.label}")'>
      <div class="card-num">0${totalIdx + 1}</div>
      <div class="card-title">${story.title || ''}</div>
      <div class="card-summary">${story.summary || story.description || ''}</div>
      <div class="card-footer">
        <span class="card-source">${story.source || ''}</span>
        <span class="card-arrow">→</span>
      </div>
    </div>`;

  const topHTML = top3.length
    ? `<div class="card-grid-top">${top3.map((s,i) => cardHTML(s,i,i)).join('')}</div>`
    : '';

  const botHTML = bot2.length
    ? `<div class="card-grid-bottom">${bot2.map((s,i) => cardHTML(s,i,i+3)).join('')}</div>`
    : '';

  const emptyHTML = !stories.length
    ? `<div class="empty-section">Next edition at 6:00 AM IST</div>`
    : '';

  return `
    <div class="cat-section ${cat.cls}">
      <div class="cat-header">
        <div class="cat-dot"></div>
        <div class="cat-title">${cat.label}</div>
        <div class="cat-count">${stories.length} stories</div>
      </div>
      ${topHTML}${botHTML}${emptyHTML}
    </div>`;
}

async function loadData() {
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error('no data');
    const data = await res.json();
    const stories = Array.isArray(data) ? data : (data.stories || data.articles || []);

    // Bucket into categories
    const buckets = { tech: [], world: [], health: [], india: [] };
    stories.forEach(s => {
      const cat = detectCategory(s);
      if (buckets[cat]) buckets[cat].push(s);
      else buckets.world.push(s);
    });

    document.getElementById('statTotal').textContent = stories.length;

    document.getElementById('main').innerHTML = CATEGORIES
      .map(cat => buildSection(cat, buckets[cat.key] || []))
      .join('');

  } catch(e) {
    document.getElementById('statTotal').textContent = '0';
    document.getElementById('main').innerHTML = CATEGORIES
      .map(cat => buildSection(cat, []))
      .join('');
  }
}

loadData();
</script>
</body>
</html>
