<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070F;--bg2:#0C0C1A;--bg3:#10101E;
  --blue:#2979FF;--blue-b:#00B4FF;--blue-p:#5CC8FF;
  --gold-d:#B8902A;--gold-m:#E8C558;--gold-l:#FFE878;
  --w:#fff;--w9:rgba(255,255,255,.9);--w7:rgba(255,255,255,.7);
  --w5:rgba(255,255,255,.5);--w3:rgba(255,255,255,.3);--w1:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --card-bg:var(--bg2);--nav-bg:rgba(7,7,15,.85);
}
[data-theme="light"]{
  --bg:#F5F5F0;--bg2:#FFFFFF;--bg3:#EFEFEA;
  --w:#0A0A14;--w9:rgba(10,10,20,.9);--w7:rgba(10,10,20,.7);
  --w5:rgba(10,10,20,.5);--w3:rgba(10,10,20,.3);--w1:rgba(10,10,20,.1);
  --border:rgba(10,10,20,.08);--border2:rgba(10,10,20,.14);
  --card-bg:#FFFFFF;--nav-bg:rgba(245,245,240,.92);
}
html,body{background:var(--bg);color:var(--w);font-family:'DM Sans',sans-serif;overflow-x:hidden;line-height:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.top-line{position:fixed;top:0;left:0;right:0;height:1.5px;z-index:300;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(0,180,255,.2) 10%,rgba(100,210,255,.95) 38%,#fff 50%,rgba(100,210,255,.95) 62%,rgba(0,180,255,.2) 90%,transparent 100%);}
nav{position:fixed;top:0;left:0;right:0;height:64px;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 48px;backdrop-filter:blur(24px);background:var(--nav-bg);border-bottom:.5px solid var(--border);transition:background .3s;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;}
.logo-text{display:flex;align-items:baseline;gap:4px;}
.logo-the,.logo-brief{font-family:'Cormorant SC',serif;font-size:10px;font-weight:400;letter-spacing:.22em;color:rgba(220,185,100,.7);}
.logo-dawn{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;font-style:italic;background:linear-gradient(90deg,#C8960E 0%,#F0C830 25%,#FFE878 50%,#F0C830 75%,#C8960E 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-btn{padding:8px 16px;border-radius:100px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.nav-back{background:transparent;border:.5px solid var(--border);color:var(--w5);}
.nav-back:hover{border-color:var(--border2);color:var(--w);}
.nav-sub{background:var(--blue);border:none;color:#fff;}
.nav-sub:hover{background:var(--blue-b);}
.nav-icon-btn{width:36px;height:36px;border-radius:10px;background:transparent;border:.5px solid var(--border);color:var(--w5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;}
.nav-icon-btn:hover{background:var(--w1);color:var(--w);}

.wrap{max-width:1000px;margin:0 auto;padding:120px 48px 80px;}
.page-head{margin-bottom:48px;animation:fadeUp .5s ease both;}
.page-icon{font-size:40px;margin-bottom:16px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,6vw,60px);font-weight:600;font-style:italic;color:var(--w);line-height:1.05;margin-bottom:14px;}
.page-sub{font-size:15px;color:var(--w5);line-height:1.6;max-width:520px;}

.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.cat-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:26px 28px;text-decoration:none;display:block;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;animation:fadeUp .5s ease both;}
.cat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--gold-d),var(--gold-m),var(--gold-d));opacity:0;transition:opacity .25s;}
.cat-card:hover{transform:translateY(-4px);border-color:rgba(232,197,88,.25);box-shadow:0 12px 40px rgba(0,0,0,.35);}
.cat-card:hover::before{opacity:1;}
.cat-card:hover .cc-title{color:var(--gold-m);}
.cat-card:hover .cc-arrow{transform:translateX(4px);opacity:1;}
.cc-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.cc-icon{font-size:30px;flex-shrink:0;}
.cc-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;font-style:italic;color:var(--w9);line-height:1.1;transition:color .25s;}
.cc-desc{font-size:13px;color:var(--w5);line-height:1.65;}
.cc-arrow{position:absolute;right:24px;top:28px;font-size:18px;color:var(--gold-m);opacity:.3;transition:all .25s;}

footer{border-top:.5px solid var(--border);padding:28px 0;position:relative;z-index:5;}
.ft-inner{max-width:1000px;margin:0 auto;padding:0 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.ft-copy{font-size:11px;color:var(--w3);}
.ft-links{display:flex;gap:16px;}
.ft-link{font-size:11px;color:var(--w3);text-decoration:none;}
.ft-link:hover{color:var(--blue-p);}

@media(max-width:640px){
  nav{padding:0 16px;}
  .wrap{padding:100px 16px 60px;}
  .cat-grid{grid-template-columns:1fr;}
  .ft-inner{padding:0 16px;flex-direction:column;gap:14px;text-align:center;}
}
</style>
</head>
<body>
<div class="top-line"></div>

<nav>
  <a class="logo" href="index.html">
    <svg width="30" height="24" viewBox="0 0 34 28" fill="none"><defs><linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8A6218"/><stop offset="40%" stop-color="#E8C558"/><stop offset="60%" stop-color="#FFF0B0"/><stop offset="100%" stop-color="#8A6218"/></linearGradient><clipPath id="cp1"><rect x="0" y="0" width="34" height="19"/></clipPath></defs><line x1="1" y1="19" x2="33" y2="19" stroke="url(#lg1)" stroke-width="1" opacity=".9"/><circle cx="17" cy="19" r="9" stroke="url(#lg1)" stroke-width="1.5" fill="none" clip-path="url(#cp1)"/><line x1="17" y1="8.5" x2="17" y2="4" stroke="#FFE060" stroke-width="1.2" stroke-linecap="round"/><line x1="21.8" y1="10.8" x2="24.8" y2="7.8" stroke="#F0C830" stroke-width="1.1" stroke-linecap="round" opacity=".95"/><line x1="12.2" y1="10.8" x2="9.2" y2="7.8" stroke="#F0C830" stroke-width="1.1" stroke-linecap="round" opacity=".95"/><circle cx="17" cy="19" r="1.2" fill="#FFF5C0" opacity=".8"/></svg>
    <div class="logo-text"><span class="logo-the">The</span><span class="logo-dawn">Dawn</span><span class="logo-brief">Brief</span></div>
  </a>
  <div class="nav-right">
    <button class="nav-icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <button class="nav-btn nav-back" onclick="window.location='index.html'">← Home</button>
    <button class="nav-btn nav-sub" onclick="window.location='index.html'">Subscribe →</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="page-icon">📚</div>
    <h1 class="page-title">All Topics</h1>
    <p class="page-sub">Everything we cover, in one place. Pick what you care about — we'll keep you sharp on it.</p>
  </div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<footer>
  <div class="ft-inner">
    <div class="ft-copy">© 2026 The Dawn Brief · thedawnbrief.com</div>
    <div class="ft-links">
      <a class="ft-link" href="index.html">Home</a>
      <a class="ft-link" href="about.html">About</a>
      <a class="ft-link" href="privacy.html">Privacy</a>
      <a class="ft-link" href="terms.html">Terms</a>
    </div>
  </div>
</footer>

<script>
var CAT_ICONS={'Business':'💼','Indian Economy':'🇮🇳','Finance':'📈','Tech':'💻','Sports':'⚽','Government':'🏛️','International':'🌍','Climate':'🌿','Startups & Auto':'🚀','Science & Health':'🔬','Entertainment':'🎬'};
var CAT_DESCS={'Business':'Corporate moves, market shifts, and the deals that shape your world.','Indian Economy':'Policy, growth, and the numbers that run Bharat.','Finance':'Markets, money, and what your wallet should know.','Tech':'AI, startups, and the gadgets everyone is talking about.','Sports':'Scores, drama, and the moments that matter.','Government':'Policy, parliament, and what is happening in Delhi.','International':'World news that affects India directly.','Climate':'Environment, energy, and the planet we share.','Startups & Auto':'New launches, EVs, funding, and the roads ahead.','Science & Health':'ISRO, health breakthroughs, and discoveries.','Entertainment':'Films, OTT, and culture worth knowing.'};
var ORDER=['Business','Indian Economy','Finance','Tech','Sports','Government','International','Climate','Startups & Auto','Science & Health','Entertainment'];

(function(){var t=localStorage.getItem('db_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');var b=document.getElementById('theme-btn');if(b)b.textContent='☀️';}})();
function toggleTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')!=='light';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('theme-btn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('db_theme',isDark?'light':'dark');
}

var grid=document.getElementById('cat-grid');
grid.innerHTML=ORDER.map(function(c,i){
  return '<a class="cat-card" style="animation-delay:'+(i*0.04)+'s;" href="category.html?cat='+encodeURIComponent(c)+'">'
    +'<span class="cc-arrow">→</span>'
    +'<div class="cc-top"><span class="cc-icon">'+CAT_ICONS[c]+'</span><span class="cc-title">'+c+'</span></div>'
    +'<div class="cc-desc">'+(CAT_DESCS[c]||'')+'</div>'
    +'</a>';
}).join('');
</script>
