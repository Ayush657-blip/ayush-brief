name: Keep Backend Awake

# Pings the Railway backend every 10 min during active hours (IST)
# so it never sleeps → no cold-start delay → fast story loading.
# Time slots (IST): 7-11 AM, 1-3 PM, 7-11 PM. Night = off (saves credit).
# GitHub Actions runs in UTC. IST = UTC + 5:30.

on:
  schedule:
    # ── Morning: 7:00-11:00 AM IST  =  1:30-5:30 UTC ──
    - cron: '30,40,50 1 * * *'
    - cron: '0,10,20,30,40,50 2 * * *'
    - cron: '0,10,20,30,40,50 3 * * *'
    - cron: '0,10,20,30,40,50 4 * * *'
    - cron: '0,10,20,30 5 * * *'
    # ── Afternoon: 1:00-3:00 PM IST  =  7:30-9:30 UTC ──
    - cron: '30,40,50 7 * * *'
    - cron: '0,10,20,30,40,50 8 * * *'
    - cron: '0,10,20,30 9 * * *'
    # ── Evening: 7:00-11:00 PM IST  =  13:30-17:30 UTC ──
    - cron: '30,40,50 13 * * *'
    - cron: '0,10,20,30,40,50 14 * * *'
    - cron: '0,10,20,30,40,50 15 * * *'
    - cron: '0,10,20,30,40,50 16 * * *'
    - cron: '0,10,20,30 17 * * *'
  workflow_dispatch: {}   # manual run button in Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging backend to keep it awake..."
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.ayushbrief.online/health || echo "000")
          echo "Response code: $code"
          # 200 = healthy, 503 = awake but degraded — both mean it's NOT asleep.
          if [ "$code" = "200" ] || [ "$code" = "503" ]; then
            echo "Backend is awake."
          else
            echo "Backend did not respond cleanly (code $code) — it may have been cold-starting."
          fi
