<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070F;--bg2:#0C0C1A;--bg3:#10101E;
  --blue:#2979FF;--blue-b:#00B4FF;--blue-p:#5CC8FF;
  --gold-d:#B8902A;--gold-m:#E8C558;--gold-l:#FFE878;
  --w:#fff;--w9:rgba(255,255,255,.9);--w7:rgba(255,255,255,.7);
  --w5:rgba(255,255,255,.5);--w3:rgba(255,255,255,.3);--w1:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --card-bg:var(--bg2);--nav-bg:rgba(7,7,15,.85);
}
[data-theme="light"]{
  --bg:#F5F5F0;--bg2:#FFFFFF;--bg3:#EFEFEA;
  --w:#0A0A14;--w9:rgba(10,10,20,.9);--w7:rgba(10,10,20,.7);
  --w5:rgba(10,10,20,.5);--w3:rgba(10,10,20,.3);--w1:rgba(10,10,20,.1);
  --border:rgba(10,10,20,.08);--border2:rgba(10,10,20,.14);
  --card-bg:#FFFFFF;--nav-bg:rgba(245,245,240,.92);
}
html,body{background:var(--bg);color:var(--w);font-family:'DM Sans',sans-serif;overflow-x:hidden;line-height:1;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes shimmer{0%{background-position:-1000px 0;}100%{background-position:1000px 0;}}
@keyframes pulse-glow{0%,100%{opacity:.5;}50%{opacity:.9;}}
.glow-wrap{position:fixed;top:0;left:0;right:0;height:400px;z-index:0;pointer-events:none;}
.glow-a{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:500px;background:radial-gradient(ellipse 60% 50% at 50% 20%,rgba(0,90,255,.18) 0%,transparent 100%);animation:pulse-glow 4s ease-in-out infinite;}
.top-line{position:fixed;top:0;left:0;right:0;height:1.5px;z-index:300;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(0,180,255,.2) 10%,rgba(100,210,255,.95) 38%,#fff 50%,rgba(100,210,255,.95) 62%,rgba(0,180,255,.2) 90%,transparent 100%);}
nav{position:fixed;top:0;left:0;right:0;height:64px;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 48px;backdrop-filter:blur(24px);background:var(--nav-bg);border-bottom:.5px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;}
.logo-text{display:flex;align-items:baseline;gap:4px;}
.logo-the,.logo-brief{font-family:'Cormorant SC',serif;font-size:10px;font-weight:400;letter-spacing:.22em;color:rgba(220,185,100,.7);}
.logo-dawn{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;font-style:italic;background:linear-gradient(90deg,#C8960E 0%,#F0C830 25%,#FFE878 50%,#F0C830 75%,#C8960E 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-btn{padding:8px 16px;border-radius:100px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.nav-back{background:transparent;border:.5px solid var(--border);color:var(--w5);}
.nav-back:hover{border-color:var(--border2);color:var(--w);}
.nav-sub{background:var(--blue);border:none;color:#fff;}
.nav-sub:hover{background:var(--blue-b);}
.nav-icon-btn{width:36px;height:36px;border-radius:10px;background:transparent;border:.5px solid var(--border);color:var(--w5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;}
.nav-icon-btn:hover{background:var(--w1);color:var(--w);}
.story-wrap{max-width:680px;margin:0 auto;padding:100px 24px 80px;position:relative;z-index:5;animation:fadeIn .4s ease;}
.story-cat{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-p);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.story-cat-dot{width:4px;height:4px;border-radius:50%;background:var(--blue-p);}
.story-headline{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,44px);font-weight:400;font-style:italic;color:var(--w9);line-height:1.2;margin-bottom:16px;}
.story-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--w3);margin-bottom:28px;flex-wrap:wrap;}
.story-meta-dot{width:3px;height:3px;border-radius:50%;background:var(--w3);}
.story-img{width:100%;border-radius:14px;overflow:hidden;margin-bottom:28px;background:var(--bg3);}
.story-img img{width:100%;display:block;max-height:400px;object-fit:cover;}
.story-img-ph{height:240px;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.2;}
.voice-box{border-radius:14px;padding:24px;margin-bottom:28px;position:relative;overflow:hidden;}
.voice-box-student{background:rgba(255,77,109,.07);border:.5px solid rgba(255,77,109,.2);}
.voice-box-professional{background:rgba(255,165,50,.07);border:.5px solid rgba(255,165,50,.2);}
.voice-box-default{background:rgba(41,121,255,.07);border:.5px solid rgba(92,200,255,.2);}
.voice-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
.voice-label-student{color:#FF4D6D;}
.voice-label-professional{color:#FFAA55;}
.voice-label-default{color:var(--blue-p);}
.voice-text{font-size:15px;color:var(--w7);line-height:1.85;}
.voice-preview{position:relative;}
.voice-blurred{filter:blur(5px);user-select:none;pointer-events:none;opacity:.6;}
.voice-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(to bottom,transparent 0%,var(--bg2) 60%);}
.lock-icon{font-size:28px;}
.lock-text{font-size:13px;color:var(--w5);text-align:center;line-height:1.6;}
.lock-btn{padding:10px 24px;border-radius:100px;background:var(--blue);border:none;color:#fff;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s;}
.lock-btn:hover{background:var(--blue-b);}
.share-row{display:flex;gap:10px;align-items:center;padding:20px 0;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);margin-bottom:32px;flex-wrap:wrap;}
.share-label{font-size:12px;color:var(--w3);margin-right:4px;}
.share-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .2s;}
.share-wa{background:rgba(37,211,102,.12);color:#25D366;border:.5px solid rgba(37,211,102,.3);}
.share-wa:hover{background:rgba(37,211,102,.2);}
.share-x{background:var(--w1);color:var(--w7);border:.5px solid var(--border);}
.share-x:hover{background:rgba(255,255,255,.12);}
.share-copy{background:rgba(92,200,255,.08);color:var(--blue-p);border:.5px solid rgba(92,200,255,.2);}
.share-copy:hover{background:rgba(92,200,255,.15);}
.share-copied{color:var(--green)!important;border-color:var(--green)!important;}
.referral-box{background:linear-gradient(135deg,rgba(41,121,255,.08),rgba(0,100,200,.04));border:.5px solid rgba(92,200,255,.15);border-radius:16px;padding:28px;text-align:center;margin-bottom:32px;}
.referral-icon{font-size:28px;margin-bottom:10px;}
.referral-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;font-style:italic;color:var(--w);margin-bottom:6px;}
.referral-sub{font-size:13px;color:var(--w3);line-height:1.6;margin-bottom:16px;}
.referral-btn{padding:10px 24px;border-radius:100px;background:var(--blue);border:none;color:#fff;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s;}
.referral-btn:hover{background:var(--blue-b);}
.more-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;font-style:italic;color:var(--w);margin-bottom:16px;}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.more-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;text-decoration:none;display:block;}
.more-card:hover{transform:translateY(-3px);border-color:rgba(92,200,255,.2);}
.more-card-bar{height:2.5px;}
.more-card-body{padding:14px;}
.more-card-cat{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-p);margin-bottom:6px;}
.more-card-hl{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:var(--w9);line-height:1.3;}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:1000px 100%;animation:shimmer 1.5s infinite;}
.skel-line{height:12px;border-radius:6px;margin-bottom:10px;}
footer{border-top:.5px solid var(--border);padding:28px 0;margin-top:60px;position:relative;z-index:5;}
.ft-inner{max-width:680px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.ft-copy{font-size:11px;color:var(--w3);}
.ft-links{display:flex;gap:16px;}
.ft-link{font-size:11px;color:var(--w3);text-decoration:none;}
.ft-link:hover{color:var(--blue-p);}
@media(max-width:640px){
  nav{padding:0 16px;}
  .story-wrap{padding:84px 16px 60px;}
  .more-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>
var API='https://api.ayushbrief.online';
var SUPA_URL='https://ygkviidhuqicfnvyuiiu.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlna3ZpaWRodXFpY2Zudnl1aWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDU0NjIsImV4cCI6MjA5NTAyMTQ2Mn0.h7Qy5uGWBx4dP4-gFFZYxuMQvMBu0QTjdIx9nrg9oZ0';
var CARD_COLORS=['#D97706','#7C3AED','#2563EB','#059669','#DC2626','#4F46E5','#0891B2','#7C2D12','#065F46'];
var CAT_ICONS={'Business':'💼','Indian Economy':'🇮🇳','Finance':'📈','Tech':'💻','Sports':'⚽','Government':'🏛️','International':'🌍','Climate':'🌿','Auto':'🚗','Science':'🔬','Entertainment':'🎬'};

var params=new URLSearchParams(window.location.search);
var storyId=parseInt(params.get('id')||'0');
var isPersonalised=params.get('pers')==='1';
var loggedInUser=null;
var allStories=[];

function toggleTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')!=='light';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('theme-btn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('db_theme',isDark?'light':'dark');
}
(function(){var t=localStorage.getItem('db_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');var btn=document.getElementById('theme-btn');if(btn)btn.textContent='☀️';}})();

(function(){var s=localStorage.getItem('db_user');if(s){try{loggedInUser=JSON.parse(s);}catch(e){}}})();

async function loadStory(){
  var wrap=document.getElementById('story-wrap');
  var cached=localStorage.getItem('db_stories');
  var stories=[];
  if(cached){try{stories=JSON.parse(cached);}catch(e){}}
  if(!stories||stories.length===0){
    try{
      var r=await fetch(API+'/data');
      var d=await r.json();
      stories=d.stories||[];
    }catch(e){
      try{var r2=await fetch('/data-backup.json');var d2=await r2.json();stories=d2.stories||[];}catch(e2){}
    }
  }
  allStories=stories;
  var story=stories[storyId];
  if(!story){
    wrap.innerHTML='<div style="text-align:center;padding:60px 0;"><div style="font-size:48px;margin-bottom:16px;">😕</div><div style="font-size:18px;color:var(--w3);">Story not found.</div><a href="index.html" style="color:var(--blue-p);text-decoration:none;font-size:14px;">← Go back home</a></div>';
    return;
  }

  // Update meta + OG tags dynamically
  document.title=story.headline+' — The Dawn Brief';
  var desc=(story.summary||story.headline).slice(0,160);
  var storyUrl=window.location.href;
  var storyImg=story.image||'https://ayushbrief.online/og-image.png';
  var setMeta=function(id,val){var el=document.getElementById(id);if(el)el.setAttribute('content',val);};
  setMeta('meta-desc',desc);
  setMeta('og-title',story.headline+' — The Dawn Brief');
  setMeta('og-desc',desc);
  setMeta('og-image',storyImg);
  setMeta('og-url',storyUrl);
  setMeta('tw-title',story.headline+' — The Dawn Brief');
  setMeta('tw-desc',desc);

  trackStoryClick(story);

  var isSubscriber=!!loggedInUser;
  var roleKey=loggedInUser?(loggedInUser.role==='student'?'student':'professional'):'default';
  var voiceText=story.voices&&story.voices[roleKey]?story.voices[roleKey]:(story.summary||'');

  var voiceClass=roleKey==='student'?'voice-box-student':roleKey==='professional'?'voice-box-professional':'voice-box-default';
  var voiceLabelClass=roleKey==='student'?'voice-label-student':roleKey==='professional'?'voice-label-professional':'voice-label-default';
  var voiceLabelText=roleKey==='student'?'🎓 Student Edition':roleKey==='professional'?'💼 Professional Edition':'☀️ The Dawn Brief';

  var col=CARD_COLORS[storyId%CARD_COLORS.length];
  var icon=CAT_ICONS[story.category]||'📰';
  var now=new Date();
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dateStr=months[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();

  var voiceHTML='';
  if(isSubscriber&&voiceText){
    voiceHTML='<div class="voice-box '+voiceClass+'"><div class="voice-label '+voiceLabelClass+'">'+voiceLabelText+'</div><div class="voice-text">'+voiceText+'</div></div>';
  } else if(voiceText){
    var preview=voiceText.substring(0,120)+'...';
    var blurred=voiceText.substring(120)||voiceText;
    voiceHTML='<div class="voice-box voice-box-default">'
      +'<div class="voice-label voice-label-default">☀️ Friend Voice Preview</div>'
      +'<div class="voice-preview">'
      +'<div class="voice-text">'+preview+'</div>'
      +'<div class="voice-text voice-blurred">'+blurred+'</div>'
      +'<div class="voice-lock">'
      +'<div class="lock-icon">🔒</div>'
      +'<div class="lock-text">Subscribe to read the full story in your voice —<br>Student or Professional. Funny. In your language.</div>'
      +'<button class="lock-btn" onclick="window.location=\'index.html\'">Subscribe free →</button>'
      +'</div>'
      +'</div></div>';
  }

  var referralHTML='';
  if(!isSubscriber){
    referralHTML='<div class="referral-box"><div class="referral-icon">👋</div><div class="referral-title">Your friend thought you would like this.</div><div class="referral-sub">They were right. Get your daily dose of news that does not bore you. Free. Every morning.</div><button class="referral-btn" onclick="window.location=\'index.html\'">Join the gang →</button></div>';
  }

  var moreStories=stories.filter(function(_,i){return i!==storyId;}).slice(0,4);
  var moreHTML=moreStories.length?'<div style="margin-top:40px;"><div class="more-title">More stories</div><div class="more-grid">'+moreStories.map(function(s,i){var c=CARD_COLORS[(storyId+i+1)%CARD_COLORS.length];return '<a class="more-card" href="story.html?id='+stories.indexOf(s)+'"><div class="more-card-bar" style="background:'+c+';"></div><div class="more-card-body"><div class="more-card-cat">'+s.category+'</div><div class="more-card-hl">'+s.headline+'</div></div></a>';}).join('')+'</div></div>':'';

  var imgHTML=story.image?'<div class="story-img"><img src="'+story.image+'" alt="'+story.headline+'" onerror="this.style.display=\'none\'" loading="eager"></div>':'<div class="story-img"><div class="story-img-ph">'+icon+'</div></div>';

  wrap.innerHTML=
    '<div class="story-cat"><div class="story-cat-dot"></div>'+story.category+'</div>'
    +'<h1 class="story-headline">'+story.headline+'</h1>'
    +'<div class="story-meta"><span>The Dawn Brief</span><div class="story-meta-dot"></div><span>'+dateStr+'</span><div class="story-meta-dot"></div><span>2 min read</span></div>'
    +imgHTML
    +voiceHTML
    +'<div class="share-row">'
    +'<span class="share-label">Share:</span>'
    +'<button class="share-btn share-wa" onclick="shareWA()">🟢 WhatsApp</button>'
    +'<button class="share-btn share-x" onclick="shareX()">𝕏 Post</button>'
    +'<button class="share-btn share-copy" id="copy-btn" onclick="copyLink()">🔗 Copy link</button>'
    +'</div>'
    +referralHTML
    +moreHTML;
}

function shareWA(){
  var story=allStories[storyId];
  var text=encodeURIComponent((story?story.headline:'Check this out')+' — '+window.location.href+' via @thedawnbrief');
  window.open('https://wa.me/?text='+text,'_blank');
  trackEvent('share',{platform:'whatsapp',story:storyId});
}
function shareX(){
  var story=allStories[storyId];
  var text=encodeURIComponent((story?story.headline:'Check this out')+' '+window.location.href+' via @thedawnbrief');
  window.open('https://x.com/intent/tweet?text='+text,'_blank');
  trackEvent('share',{platform:'x',story:storyId});
}
function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(function(){
    var btn=document.getElementById('copy-btn');
    if(btn){btn.textContent='✅ Copied!';btn.classList.add('share-copied');setTimeout(function(){btn.textContent='🔗 Copy link';btn.classList.remove('share-copied');},2000);}
  });
  trackEvent('share',{platform:'copy',story:storyId});
}

async function trackStoryClick(story){
  try{
    await fetch(SUPA_URL+'/rest/v1/story_clicks',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({headline:story.headline,category:story.category,story_index:storyId,user_email:(loggedInUser&&loggedInUser.email)||'anonymous'})});
  }catch(e){}
  if(typeof gtag!=='undefined')gtag('event','story_click',{story_id:storyId,category:story.category});
}
function trackEvent(name,data){if(typeof gtag!=='undefined')gtag('event',name,data);}

loadStory();
</script>
