<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070F;--bg2:#0C0C1A;--bg3:#10101E;
  --blue:#2979FF;--blue-b:#00B4FF;--blue-p:#5CC8FF;
  --gold-d:#B8902A;--gold-m:#E8C558;--gold-l:#FFE878;
  --w:#fff;--w9:rgba(255,255,255,.9);--w7:rgba(255,255,255,.7);
  --w5:rgba(255,255,255,.5);--w3:rgba(255,255,255,.3);--w1:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --card-bg:var(--bg2);--nav-bg:rgba(7,7,15,.85);
}
[data-theme="light"]{
  --bg:#F5F5F0;--bg2:#FFFFFF;--bg3:#EFEFEA;
  --w:#0A0A14;--w9:rgba(10,10,20,.9);--w7:rgba(10,10,20,.7);
  --w5:rgba(10,10,20,.5);--w3:rgba(10,10,20,.3);--w1:rgba(10,10,20,.1);
  --border:rgba(10,10,20,.08);--border2:rgba(10,10,20,.14);
  --card-bg:#FFFFFF;--nav-bg:rgba(245,245,240,.92);
}
html,body{background:var(--bg);color:var(--w);font-family:'DM Sans',sans-serif;overflow-x:hidden;line-height:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes shimmer{0%{background-position:-1000px 0;}100%{background-position:1000px 0;}}
@keyframes pulse-glow{0%,100%{opacity:.5;}50%{opacity:.9;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* NAV */
.top-line{position:fixed;top:0;left:0;right:0;height:1.5px;z-index:300;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(0,180,255,.2) 10%,rgba(100,210,255,.95) 38%,#fff 50%,rgba(100,210,255,.95) 62%,rgba(0,180,255,.2) 90%,transparent 100%);}
nav{position:fixed;top:0;left:0;right:0;height:64px;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 48px;backdrop-filter:blur(24px);background:var(--nav-bg);border-bottom:.5px solid var(--border);transition:background .3s;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;}
.logo-text{display:flex;align-items:baseline;gap:4px;}
.logo-the,.logo-brief{font-family:'Cormorant SC',serif;font-size:10px;font-weight:400;letter-spacing:.22em;color:rgba(220,185,100,.7);}
.logo-dawn{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;font-style:italic;background:linear-gradient(90deg,#C8960E 0%,#F0C830 25%,#FFE878 50%,#F0C830 75%,#C8960E 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-btn{padding:8px 16px;border-radius:100px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.nav-back{background:transparent;border:.5px solid var(--border);color:var(--w5);}
.nav-back:hover{border-color:var(--border2);color:var(--w);}
.nav-sub{background:var(--blue);border:none;color:#fff;}
.nav-sub:hover{background:var(--blue-b);}
.nav-icon-btn{width:36px;height:36px;border-radius:10px;background:transparent;border:.5px solid var(--border);color:var(--w5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;}
.nav-icon-btn:hover{background:var(--w1);color:var(--w);}

/* ── HERO (full-bleed image + headline overlay) ── */

@media(max-width:640px){.hero{height:380px;}}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.hero-img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;opacity:.15;background:var(--bg3);}
/* multi-layer gradient: dark at bottom for text, subtle vignette top */

.hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 48px 36px;animation:fadeUp .55s ease both;}

.hero-cat-dot{width:4px;height:4px;border-radius:50%;background:var(--gold-m);flex-shrink:0;}
.hero-headline{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4.5vw,46px);font-weight:600;font-style:italic;color:#fff;line-height:1.18;max-width:760px;text-shadow:0 2px 24px rgba(0,0,0,.6);}

.hero-meta-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.35);}

/* ── BODY ── */
.story-body{max-width:680px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:5;}

/* WhatsApp floating CTA */

/* Voice / summary card */
.voice-card{border-radius:16px;padding:28px 32px;margin-bottom:32px;position:relative;overflow:hidden;animation:fadeUp .5s .2s ease both;opacity:0;}
.voice-card-dawn{background:linear-gradient(135deg,rgba(184,144,42,.1) 0%,rgba(12,12,26,.6) 100%);border:.5px solid rgba(232,197,88,.2);}

/* gold left accent bar */
.voice-card::before{content:'';position:absolute;left:0;top:24px;bottom:24px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(to bottom,var(--gold-d),var(--gold-m),var(--gold-d));}
.voice-card-student::before{background:linear-gradient(to bottom,#FF4D6D,#FF8FA3,#FF4D6D);}
.voice-card-professional::before{background:linear-gradient(to bottom,#F59E0B,#FCD34D,#F59E0B);}
.voice-badge{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-m);margin-bottom:16px;}

.voice-badge-professional{color:#FFAA55;}
.voice-text{font-size:15px;color:var(--w7);line-height:1.9;}
.voice-text p{margin:0 0 18px;}
.voice-text p:last-child{margin-bottom:0;}

/* Share row */
.share-section{margin-bottom:32px;animation:fadeUp .5s .3s ease both;opacity:0;}
.share-label{font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}
.share-row{display:flex;gap:10px;flex-wrap:wrap;}

/* WhatsApp — big & green */
.share-wa{background:rgba(37,211,102,.14);color:#25D366;border:.5px solid rgba(37,211,102,.35);flex:1;justify-content:center;min-width:140px;font-size:14px;padding:12px 20px;}

.share-x{background:var(--w1);color:var(--w7);border:.5px solid var(--border);}

.share-copy{background:rgba(232,197,88,.08);color:var(--gold-m);border:.5px solid rgba(232,197,88,.2);}
.share-copy:hover{background:rgba(232,197,88,.15);}
.share-copied{color:#4ade80!important;border-color:#4ade80!important;}

/* Original source link */
.source-link{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--bg2);border:.5px solid var(--border);border-radius:12px;text-decoration:none;margin-bottom:32px;transition:border-color .2s;animation:fadeUp .5s .35s ease both;opacity:0;}

.referral-sub{font-size:13px;color:var(--w3);line-height:1.7;margin-bottom:20px;max-width:360px;margin-left:auto;margin-right:auto;}
.referral-btn{padding:12px 28px;border-radius:100px;background:var(--blue);border:none;color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.referral-btn:hover{background:var(--blue-b);transform:translateY(-1px);box-shadow:0 4px 20px rgba(41,121,255,.3);}

/* More from category */
.more-section{animation:fadeUp .5s .45s ease both;opacity:0;}
.more-heading{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;font-style:italic;color:var(--w);margin-bottom:4px;}
.more-subheading{font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;}
.more-divider{height:.5px;background:linear-gradient(90deg,var(--gold-d),transparent);margin-bottom:20px;}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.more-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s;text-decoration:none;display:block;position:relative;}
.more-card:hover{transform:translateY(-4px);border-color:rgba(232,197,88,.2);box-shadow:0 8px 32px rgba(0,0,0,.3);}
.more-card-img{width:100%;height:90px;object-fit:cover;display:block;}
.more-card-img-ph{width:100%;height:90px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.2;}
.more-card-body{padding:14px;}
.more-card-cat{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-d);margin-bottom:7px;}
.more-card-hl{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:var(--w9);line-height:1.35;}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:1000px 100%;animation:shimmer 1.5s infinite;}
.skel-line{height:12px;border-radius:6px;margin-bottom:10px;}

footer{border-top:.5px solid var(--border);padding:28px 0;margin-top:20px;position:relative;z-index:5;}
.ft-inner{max-width:680px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.ft-copy{font-size:11px;color:var(--w3);}
.ft-links{display:flex;gap:16px;}
.ft-link{font-size:11px;color:var(--w3);text-decoration:none;}
.ft-link:hover{color:var(--blue-p);}

@media(max-width:640px){
  nav{padding:0 16px;}
  .story-body{padding:28px 16px 60px;}
  .voice-card{padding:22px 22px 22px 28px;}
  .more-grid{grid-template-columns:1fr;}
  .share-wa{min-width:120px;}
}
</style>

<script>
var API='https://api.ayushbrief.online';

var CAT_ICONS={'Business':'💼','Indian Economy':'🇮🇳','Finance':'📈','Tech':'💻','Sports':'⚽','Government':'🏛️','International':'🌍','Climate':'🌿','Startups & Auto':'🚀','Science & Health':'🔬','Entertainment':'🎬'};

function toParagraphs(text){
  text=(text||'').trim();
  if(!text) return '';
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var parts=[text];
  try{
    var re=new RegExp('(?<=[.!?"\\u201D])\\s+(?=[A-Z"\\u201C\\u20B9$])');
    parts=text.split(re).filter(function(x){return x&&x.trim();});
  }catch(e){ parts=[text]; }
  if(parts.length<=2) return '<p>'+esc(text)+'</p>';
  var groups=parts.length>=6?3:2;
  var per=Math.ceil(parts.length/groups);
  var out=[];
  for(var i=0;i<parts.length;i+=per){ out.push(parts.slice(i,i+per).join(' ')); }
  return out.map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('');
}

var params=new URLSearchParams(window.location.search);
var storyId=parseInt(params.get('id')||'0');
var loggedInUser=null;
var currentStory=null;

function toggleTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')!=='light';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('theme-btn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('db_theme',isDark?'light':'dark');
}
(function(){var t=localStorage.getItem('db_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');var btn=document.getElementById('theme-btn');if(btn)btn.textContent='☀️';}})();
(function(){var s=localStorage.getItem('db_user');if(s){try{loggedInUser=JSON.parse(s);}catch(e){}}})();

async function loadStory(){
  var heroWrap=document.getElementById('hero-wrap');
  var body=document.getElementById('story-body');
  var story=null, more=[];
  try{
    var r=await fetch(API+'/story?id='+encodeURIComponent(storyId));
    var d=await r.json();
    story=d.story; more=d.more||[];
  }catch(e){}

  if(!story){
    heroWrap.innerHTML='';
    body.innerHTML='<div style="text-align:center;padding:60px 0;"><div style="font-size:48px;margin-bottom:16px;">😕</div><div style="font-size:18px;color:var(--w3);">Story not found.</div><a href="index.html" style="color:var(--blue-p);text-decoration:none;font-size:14px;">← Go back home</a></div>';
    return;
  }
  currentStory=story;

  // Meta tags
  document.title=story.headline+' — The Dawn Brief';
  var desc=(story.summary||story.headline).slice(0,160);
  var storyUrl=window.location.href;
  var storyImg=story.image_url||story.image||'https://ayushbrief.online/og-image.png';
  var setMeta=function(id,val){var el=document.getElementById(id);if(el)el.setAttribute('content',val);};
  setMeta('meta-desc',desc); setMeta('og-title',story.headline+' — The Dawn Brief');
  setMeta('og-desc',desc); setMeta('og-image',storyImg); setMeta('og-url',storyUrl);
  setMeta('tw-title',story.headline+' — The Dawn Brief'); setMeta('tw-desc',desc);

  trackStoryClick(story);

  var isSubscriber=!!loggedInUser;
  var roleKey=loggedInUser?(loggedInUser.role==='student'?'student':'professional'):'default';
  var voiceText=story.voices&&story.voices[roleKey]?story.voices[roleKey]:(story.summary||'');
  var icon=CAT_ICONS[story.category]||'📰';
  var dateStr=story.date_display||'';
  var imgSrc=story.image_url||story.image||'';

  // ── HERO ──
  var heroImgHTML=imgSrc
    ?'<img class="hero-img" src="'+imgSrc+'" alt="'+story.headline+'" onerror="this.style.display=\'none\';document.querySelector(\'.hero-img-ph\').style.display=\'flex\';" loading="eager"><div class="hero-img-ph" style="display:none;">'+icon+'</div>'
    :'<div class="hero-img-ph">'+icon+'</div>';

  heroWrap.innerHTML='<div class="hero">'
    +heroImgHTML
    +'<div class="hero-gradient"></div>'
    +'<div class="hero-content">'
    +'<div class="hero-cat"><div class="hero-cat-dot"></div>'+story.category+'</div>'
    +'<h1 class="hero-headline">'+story.headline+'</h1>'
    +'<div class="hero-meta">'
    +'<span>The Dawn Brief</span>'
    +(dateStr?'<div class="hero-meta-dot"></div><span>'+dateStr+'</span>':'')
    +'<div class="hero-meta-dot"></div><span>2 min read</span>'
    +'</div>'
    +'</div>'
    +'</div>';

  // ── VOICE CARD ──
  var vClass=roleKey==='student'?'voice-card-student':roleKey==='professional'?'voice-card-professional':'voice-card-dawn';
  var vBadge=roleKey==='student'?'<span class="voice-badge voice-badge-student">🎓 Student Edition</span>':roleKey==='professional'?'<span class="voice-badge voice-badge-professional">💼 Professional Edition</span>':'<span class="voice-badge">☀️ The Dawn Brief</span>';
  var voiceHTML='<div class="voice-card '+vClass+'">'+vBadge+'<div class="voice-text">'+toParagraphs(voiceText)+'</div></div>';

  // ── SOURCE LINK ──
  var sourceHTML=story.link?'<a class="source-link" href="'+story.link+'" target="_blank" rel="noopener"><span class="source-link-left">Read original article</span><span class="source-link-right">Open source →</span></a>':'';

  // ── SHARE ──
  var shareHTML='<div class="share-section">'
    +'<div class="share-label">Share this story</div>'
    +'<div class="share-row">'
    +'<button class="share-btn share-wa" onclick="shareWA()">🟢 Share on WhatsApp</button>'
    +'<button class="share-btn share-x" onclick="shareX()">𝕏 Post</button>'
    +'<button class="share-btn share-copy" id="copy-btn" onclick="copyLink()">🔗 Copy link</button>'
    +'</div></div>';

  // ── REFERRAL ──
  var referralHTML=!isSubscriber?'<div class="referral-box"><div class="referral-icon">👋</div><div class="referral-title">Your friend thought you would like this.</div><div class="referral-sub">They were right. Get your daily dose of news that does not bore you. Free. Every morning at 6 AM.</div><button class="referral-btn" onclick="window.location=\'index.html\'">Join the gang →</button></div>':'';

  // ── MORE FROM CATEGORY ──
  var moreHTML='';
  if(more.length){
    var cards=more.map(function(m){
      var mImg=m.image_url||m.image||'';
      var mIcon=CAT_ICONS[m.category]||'📰';
      var imgPart=mImg
        ?'<img class="more-card-img" src="'+mImg+'" alt="'+m.headline+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\';" loading="lazy"><div class="more-card-img-ph" style="display:none;">'+mIcon+'</div>'
        :'<div class="more-card-img-ph">'+mIcon+'</div>';
      return '<a class="more-card" href="story.html?id='+m.id+'">'+imgPart+'<div class="more-card-body"><div class="more-card-cat">'+m.category+'</div><div class="more-card-hl">'+m.headline+'</div></div></a>';
    }).join('');
    moreHTML='<div class="more-section">'
      +'<div class="more-heading">More stories</div>'
      +'<div class="more-subheading">from '+story.category+'</div>'
      +'<div class="more-divider"></div>'
      +'<div class="more-grid">'+cards+'</div>'
      +'</div>';
  }

  body.innerHTML=voiceHTML+sourceHTML+shareHTML+referralHTML+moreHTML;
}

function shareWA(){
  var story=currentStory;
  var text=encodeURIComponent((story?story.headline:'Check this out')+' — '+window.location.href+' via @thedawnbrief');
  window.open('https://wa.me/?text='+text,'_blank');
  trackEvent('share',{platform:'whatsapp',story:storyId});
}
function shareX(){
  var story=currentStory;
  var text=encodeURIComponent((story?story.headline:'Check this out')+' '+window.location.href+' via @thedawnbrief');
  window.open('https://x.com/intent/tweet?text='+text,'_blank');
  trackEvent('share',{platform:'x',story:storyId});
}
function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(function(){
    var btn=document.getElementById('copy-btn');
    if(btn){btn.textContent='✅ Copied!';btn.classList.add('share-copied');setTimeout(function(){btn.textContent='🔗 Copy link';btn.classList.remove('share-copied');},2000);}
  });
  trackEvent('share',{platform:'copy',story:storyId});
}
async function trackStoryClick(story){
  try{
    await fetch(SUPA_URL+'/rest/v1/story_clicks',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({headline:story.headline,category:story.category,story_index:storyId,user_email:(loggedInUser&&loggedInUser.email)||'anonymous'})});
  }catch(e){}
  if(typeof gtag!=='undefined')gtag('event','story_click',{story_id:storyId,category:story.category});
}
function trackEvent(name,data){if(typeof gtag!=='undefined')gtag('event',name,data);}

loadStory();
</script>
</body>
