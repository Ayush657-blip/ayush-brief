<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dawn Brief — Curation Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070F;--bg2:#0C0C1A;--bg3:#10101E;
  --blue:#2979FF;--blue-b:#00B4FF;--blue-p:#5CC8FF;
  --gold:#E8C558;--green:#00C896;--red:#FF4D6D;--orange:#FFAA55;
  --w:#fff;--w7:rgba(255,255,255,.7);--w5:rgba(255,255,255,.5);--w3:rgba(255,255,255,.3);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
}
body{background:var(--bg);color:var(--w);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;}
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;}
.login-box{background:var(--bg2);border:.5px solid var(--border2);border-radius:20px;padding:40px;width:360px;text-align:center;}
.login-logo{font-size:36px;margin-bottom:12px;}
.login-title{font-size:22px;font-weight:600;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--w3);margin-bottom:24px;}
.login-input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--w);outline:none;margin-bottom:12px;}
.login-btn{width:100%;padding:12px;border-radius:10px;background:var(--blue);border:none;color:#fff;font-size:14px;font-weight:500;cursor:pointer;}
#main{display:none;}
.top-bar{position:sticky;top:0;z-index:50;background:rgba(7,7,15,.95);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.top-bar-left{display:flex;align-items:center;gap:12px;}
.top-logo{font-size:18px;font-weight:700;color:var(--gold);}
.top-date{font-size:12px;color:var(--w3);}
.top-bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.progress-pill{font-size:12px;padding:5px 12px;border-radius:100px;background:rgba(41,121,255,.15);border:.5px solid rgba(92,200,255,.3);color:var(--blue-p);}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .2s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-b);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-danger{background:rgba(255,77,109,.15);color:var(--red);border:.5px solid rgba(255,77,109,.3);}
.btn-danger:hover{background:rgba(255,77,109,.25);}
.btn-ghost{background:transparent;color:var(--w5);border:.5px solid var(--border);}
.btn-ghost:hover{background:rgba(255,255,255,.05);}
#submit-bar{background:linear-gradient(135deg,rgba(41,121,255,.15),rgba(0,100,200,.05));border-bottom:.5px solid rgba(92,200,255,.2);padding:12px 24px;display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
#submit-bar.show{display:flex;}
#undo-bar{background:rgba(0,200,150,.08);border-bottom:.5px solid rgba(0,200,150,.2);padding:10px 24px;display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
#undo-bar.show{display:flex;}
.undo-msg{font-size:13px;color:var(--green);}
.undo-timer{font-size:12px;color:var(--w3);}
.content{padding:20px 24px;max-width:1400px;margin:0 auto;}
.cat-section{background:var(--bg2);border:.5px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden;}
.cat-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--border);cursor:pointer;user-select:none;}
.cat-header:hover{background:rgba(255,255,255,.02);}
.cat-title{display:flex;align-items:center;gap:10px;}
.cat-name{font-size:15px;font-weight:600;}
.cat-badge{font-size:11px;padding:3px 8px;border-radius:100px;background:rgba(41,121,255,.15);border:.5px solid rgba(92,200,255,.3);color:var(--blue-p);}
.cat-prev-day{font-size:11px;padding:3px 8px;border-radius:100px;background:rgba(255,170,85,.15);border:.5px solid rgba(255,170,85,.3);color:var(--orange);}
.cat-progress{font-size:12px;color:var(--w3);}
.cat-body{padding:16px 20px;}
.phase-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.phase-tab{padding:6px 14px;border-radius:100px;font-size:12px;cursor:pointer;border:.5px solid var(--border);background:transparent;color:var(--w3);font-family:inherit;transition:all .2s;}
.phase-tab.active{background:rgba(41,121,255,.15);border-color:rgba(92,200,255,.4);color:var(--blue-p);}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
.story-card{background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;position:relative;}
.story-card:hover{border-color:rgba(92,200,255,.3);}
.story-card.selected-10{border-color:var(--blue-p);background:rgba(41,121,255,.08);}
.story-card.selected-5{border-color:var(--green);background:rgba(0,200,150,.08);}
.story-importance{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.importance-dot{font-size:14px;}
.importance-reason{font-size:11px;color:var(--w3);line-height:1.4;}
.story-headline{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:8px;color:var(--w7);}
.story-summary{font-size:12px;color:var(--w3);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.story-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.story-cat-tag{font-size:10px;padding:2px 7px;border-radius:100px;background:rgba(92,200,255,.08);border:.5px solid rgba(92,200,255,.2);color:var(--blue-p);}
.story-prev{font-size:10px;color:var(--orange);}
.story-link{font-size:11px;color:var(--blue-p);text-decoration:none;}
.story-link:hover{text-decoration:underline;}
.story-check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;}
.story-card.selected-10 .story-check{background:var(--blue);border-color:var(--blue);color:#fff;}
.story-card.selected-5 .story-check{background:var(--green);border-color:var(--green);color:#fff;}
.voice-card{background:var(--bg2);border:.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.voice-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--w3);margin-bottom:6px;}
.voice-btn{padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;border:none;font-family:inherit;}
.approve-btn{background:rgba(0,200,150,.15);color:var(--green);border:.5px solid rgba(0,200,150,.3);}
.regen-btn{background:rgba(41,121,255,.15);color:var(--blue-p);border:.5px solid rgba(92,200,255,.3);}
.save-btn{background:rgba(255,255,255,.08);color:var(--w7);border:.5px solid var(--border2);}
.voice-approved{background:rgba(0,200,150,.08);border-color:rgba(0,200,150,.3);}
.generate-section{padding:16px 0;text-align:center;border-top:.5px solid var(--border);margin-top:12px;}
.generate-btn{padding:10px 28px;border-radius:10px;background:var(--blue);border:none;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.generate-btn:disabled{opacity:.4;cursor:not-allowed;}
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:.5px solid var(--border2);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--w);z-index:1000;display:none;box-shadow:0 8px 40px rgba(0,0,0,.4);}
.loading{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--w3);padding:20px 0;}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue-p);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:640px){.top-bar{padding:10px 16px;}.content{padding:12px 16px;}.story-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">☀️</div>
    <div class="login-title">Dawn Brief</div>
    <div class="login-sub">Curation Dashboard</div>
    <input class="login-input" type="password" id="login-pass" placeholder="Enter password" />
    <button class="login-btn" onclick="doLogin()">Login →</button>
  </div>
</div>

<div id="main">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-logo">☀️ Dawn Brief</div>
      <div class="top-date" id="top-date">Loading...</div>
    </div>
    <div class="top-bar-right">
      <div class="progress-pill" id="progress-pill">0 / 11 categories done</div>
      <button class="btn btn-ghost" onclick="refreshStories()">🔄 Refresh</button>
      <button class="btn btn-primary" id="submit-btn" disabled onclick="submitAll()" style="background:var(--blue);color:#fff;">
        🚀 Submit & Publish
      </button>
    </div>
  </div>

  <div id="submit-bar">
    <div style="font-size:13px;color:var(--blue-p)">✅ Published successfully</div>
    <button class="btn btn-danger" onclick="undoSubmit()">↩️ Undo (15 min window)</button>
  </div>

  <div id="undo-bar">
    <div>
      <div class="undo-msg">✅ Submitted & live</div>
      <div class="undo-timer" id="undo-timer">Undo available for 15 minutes</div>
    </div>
    <button class="btn btn-danger" onclick="undoSubmit()">↩️ Undo Submit</button>
  </div>

  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div>Loading today's stories...</div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://ayush-brief-production.up.railway.app';
const ADMIN_PASS = 'dawnbrief2026';
let ADMIN_KEY = '';

const CATEGORIES = [
  'Business','Indian Economy','Finance','Tech','Sports',
  'Government','International','Climate','Startups & Auto',
  'Science & Health','Entertainment'
];

const CAT_ICONS = {
  'Business':'💼','Indian Economy':'🇮🇳','Finance':'📈','Tech':'💻','Sports':'⚽',
  'Government':'🏛️','International':'🌍','Climate':'🌿','Startups & Auto':'🚀',
  'Science & Health':'🔬','Entertainment':'🎬'
};

let allStories = {};
let selected10 = {};
let selected5 = {};
let approvedVoices = {};
let catDone = {};
let undoTimer = null;

// ── HELPERS ────────────────────────────────────────────────────────
function authHeaders(extra) {
  return { 'x-admin-key': ADMIN_KEY, ...extra };
}

function apiPost(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body)
  });
}

// ── LOGIN ──────────────────────────────────────────────────────────
function doLogin() {
  const pass = document.getElementById('login-pass').value;
  if (pass === ADMIN_PASS) {
    ADMIN_KEY = pass;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadStories();
  } else {
    alert('Wrong password');
  }
}
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ── LOAD STORIES ───────────────────────────────────────────────────
async function loadStories() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('top-date').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Kolkata'
  });
  try {
    const res = await fetch(`${API}/api/admin/stories?date=${today}`, {
      headers: authHeaders()
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    allStories = data.grouped;
    CATEGORIES.forEach(c => {
      selected10[c] = new Set();
      selected5[c] = new Set();
      catDone[c] = false;
    });
    renderAllCategories();
    updateProgress();
  } catch (err) {
    document.getElementById('content').innerHTML =
      `<div style="padding:40px;text-align:center;color:var(--red)">❌ ${err.message}<br><br><button class="btn btn-ghost" onclick="loadStories()">Retry</button></div>`;
  }
}

async function refreshStories() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Refreshing...</div>';
  await loadStories();
}

// ── RENDER ─────────────────────────────────────────────────────────
function renderAllCategories() {
  document.getElementById('content').innerHTML = CATEGORIES.map(cat => renderCategory(cat)).join('');
}

function renderCategory(cat) {
  const stories = allStories[cat] || [];
  const hasPrevDay = stories.some(s => s.is_previous_day);
  const mustCount = stories.filter(s => s.importance === '🔴').length;
  const sel10 = selected10[cat] ? selected10[cat].size : 0;
  const sel5 = selected5[cat] ? selected5[cat].size : 0;
  const done = catDone[cat];
  return `
<div class="cat-section" id="cat-${cat.replace(/[^a-z0-9]/gi,'_')}">
  <div class="cat-header" onclick="toggleCat('${cat}')">
    <div class="cat-title">
      <span style="font-size:18px">${CAT_ICONS[cat]||'📰'}</span>
      <span class="cat-name">${cat}</span>
      ${hasPrevDay?'<span class="cat-prev-day">📦 Previous Day</span>':''}
      <span class="cat-badge">${stories.length} stories · 🔴 ${mustCount} must</span>
      ${done?'<span style="color:var(--green);font-size:12px">✅ Done</span>':''}
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="cat-progress" id="cat-prog-${cat.replace(/[^a-z0-9]/gi,'_')}">${sel10}/10 selected · ${sel5}/5 final</span>
      <span style="color:var(--w3);font-size:12px">▼</span>
    </div>
  </div>
  <div class="cat-body" id="cat-body-${cat.replace(/[^a-z0-9]/gi,'_')}">
    ${renderCategoryBody(cat)}
  </div>
</div>`;
}

function renderCategoryBody(cat) {
  const stories = allStories[cat] || [];
  if (stories.length === 0) return '<div style="padding:20px;text-align:center;color:var(--w3)">No stories today.</div>';
  const phase = getCurrentPhase(cat);
  return `
<div class="phase-tabs">
  <button class="phase-tab ${phase===1?'active':''}" onclick="setPhase('${cat}',1)">Phase 1: Select 10</button>
  <button class="phase-tab ${phase===2?'active':''}" onclick="setPhase('${cat}',2)">Phase 2: Select 5 Final</button>
  <button class="phase-tab ${phase===3?'active':''}" onclick="setPhase('${cat}',3)">Phase 3: Review Summaries</button>
</div>
<div id="phase-content-${cat.replace(/[^a-z0-9]/gi,'_')}">${renderPhase(cat, phase)}</div>`;
}

function getCurrentPhase(cat) {
  if (selected5[cat] && selected5[cat].size > 0) return 3;
  if (selected10[cat] && selected10[cat].size >= 10) return 2;
  return 1;
}

function renderPhase(cat, phase) {
  if (phase === 1) return renderPhase1(cat);
  if (phase === 2) return renderPhase2(cat);
  if (phase === 3) return renderPhase3(cat);
  return '';
}

function renderPhase1(cat) {
  const stories = allStories[cat] || [];
  const sel = selected10[cat] || new Set();
  return `
<p style="font-size:12px;color:var(--w3);margin-bottom:12px;">🔴 Must cover stories shown first. Select your top 10. <span style="color:var(--blue-p)" id="sel10-count-${cat.replace(/[^a-z0-9]/gi,'_')}">${sel.size}/10 selected</span></p>
<div class="story-grid">
${stories.map(s => {
  const isSelected = sel.has(s.id);
  return `<div class="story-card ${isSelected?'selected-10':''}" onclick="toggleSelect10('${cat}',${s.id},this)">
  <div class="story-check">${isSelected?'✓':''}</div>
  <div class="story-importance"><span class="importance-dot">${s.importance}</span><span class="importance-reason">${s.reason||''}</span></div>
  <div class="story-headline">${s.headline}</div>
  <div class="story-summary">${s.summary||''}</div>
  <div class="story-meta">
    <span class="story-cat-tag">${s.category}</span>
    ${s.is_previous_day?'<span class="story-prev">📦 Yesterday</span>':''}
    <a href="${s.link}" target="_blank" class="story-link" onclick="event.stopPropagation()">Read →</a>
  </div>
</div>`;
}).join('')}
</div>
${sel.size >= 10 ? `<div class="generate-section"><button class="generate-btn" onclick="setPhase('${cat}',2)">Next: Select 5 Final →</button></div>` : ''}`;
}

function renderPhase2(cat) {
  const sel10ids = selected10[cat] || new Set();
  const sel5ids = selected5[cat] || new Set();
  const stories = (allStories[cat] || []).filter(s => sel10ids.has(s.id));
  return `
<p style="font-size:12px;color:var(--w3);margin-bottom:12px;">From your 10, pick the 5 best. <span style="color:var(--green)" id="sel5-count-${cat.replace(/[^a-z0-9]/gi,'_')}">${sel5ids.size}/5 selected</span></p>
<div class="story-grid">
${stories.map(s => {
  const isSelected = sel5ids.has(s.id);
  return `<div class="story-card ${isSelected?'selected-5':''}" onclick="toggleSelect5('${cat}',${s.id},this)">
  <div class="story-check">${isSelected?'✓':''}</div>
  <div class="story-importance"><span class="importance-dot">${s.importance}</span><span class="importance-reason">${s.reason||''}</span></div>
  <div class="story-headline">${s.headline}</div>
  <div class="story-summary">${s.summary||''}</div>
  <div class="story-meta">
    <span class="story-cat-tag">${s.category}</span>
    ${s.is_previous_day?'<span class="story-prev">📦 Yesterday</span>':''}
    <a href="${s.link}" target="_blank" class="story-link" onclick="event.stopPropagation()">Read →</a>
  </div>
</div>`;
}).join('')}
</div>
${sel5ids.size >= 5 ? `<div class="generate-section"><button class="generate-btn" id="gen-btn-${cat.replace(/[^a-z0-9]/gi,'_')}" onclick="generateSummaries('${cat}')">🤖 Generate Voice Summaries →</button></div>` : ''}`;
}

function renderPhase3(cat) {
  const sel5ids = selected5[cat] || new Set();
  const stories = (allStories[cat] || []).filter(s => sel5ids.has(s.id));
  const approvedCount = stories.filter(s => isStoryFullyApproved(s.id)).length;
  return `
<p style="font-size:12px;color:var(--w3);margin-bottom:12px;">Review voice summaries. Edit, regenerate, or approve. <span style="color:var(--green)">${approvedCount}/5 approved</span></p>
${stories.map(s => renderVoiceReview(s, cat)).join('')}
${approvedCount >= 5 ? `<div class="generate-section"><button class="generate-btn" style="background:var(--green)" onclick="markCatDone('${cat}')">✅ Category Done →</button></div>` : ''}`;
}

function renderVoiceReview(story, cat) {
  const voices = story.voices || {};
  const voiceKeys = [
    {key:'student', label:'🎓 Student · Hinglish'},
    {key:'professional', label:'💼 Professional · Hinglish'},
  ];
  const allApproved = isStoryFullyApproved(story.id);
  return `
<div class="voice-card ${allApproved?'voice-approved':''}" id="vc-${story.id}">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;">
    <div>
      <div class="voice-label">${story.category}</div>
      <div style="font-size:14px;font-weight:500;color:var(--w7);line-height:1.4">${story.headline}</div>
    </div>
    ${allApproved?'<span style="color:var(--green);font-size:20px">✅</span>':''}
  </div>
  ${voiceKeys.map(v => {
    const isApproved = approvedVoices[story.id] && approvedVoices[story.id][v.key];
    return `
<div style="margin-bottom:12px;border:.5px solid ${isApproved?'rgba(0,200,150,.3)':' var(--border)'};border-radius:8px;padding:10px;background:${isApproved?'rgba(0,200,150,.04)':'transparent'}" id="vk-${story.id}-${v.key}">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
    <span style="font-size:11px;color:var(--w3)">${v.label}</span>
    ${isApproved?'<span style="color:var(--green);font-size:12px">✅ Approved</span>':''}
  </div>
  <textarea id="voice-text-${story.id}-${v.key}"
    style="width:100%;background:transparent;border:none;color:var(--w7);font-family:inherit;font-size:13px;line-height:1.6;resize:vertical;min-height:60px;outline:none;"
    onchange="markEdited(${story.id},'${v.key}')"
  >${voices[v.key]||'Not generated yet'}</textarea>
  <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
    <button class="voice-btn approve-btn" onclick="approveVoice(${story.id},'${v.key}','${cat}')">✅ Approve</button>
    <button class="voice-btn regen-btn" onclick="showFeedback(${story.id},'${v.key}')">🔄 Regenerate</button>
    <button class="voice-btn save-btn" onclick="saveVoiceEdit(${story.id},'${v.key}')">💾 Save Edit</button>
  </div>
  <div id="feedback-${story.id}-${v.key}" style="display:none;margin-top:8px;">
    <input type="text" placeholder="What's wrong? e.g. Too boring, not Hinglish enough..."
      id="feedback-input-${story.id}-${v.key}"
      style="width:100%;background:rgba(255,255,255,.04);border:.5px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--w);font-family:inherit;outline:none;"
    />
    <button class="voice-btn regen-btn" style="margin-top:6px" onclick="regenerateWithFeedback(${story.id},'${v.key}','${cat}')">🔄 Regenerate with feedback</button>
  </div>
</div>`;
  }).join('')}
</div>`;
}

// ── INTERACTIONS ───────────────────────────────────────────────────
function toggleCat(cat) {
  const body = document.getElementById(`cat-body-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function setPhase(cat, phase) {
  const el = document.getElementById(`phase-content-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (el) el.innerHTML = renderPhase(cat, phase);
}

function toggleSelect10(cat, id, el) {
  const sel = selected10[cat];
  if (sel.has(id)) {
    sel.delete(id);
    el.classList.remove('selected-10');
    el.querySelector('.story-check').textContent = '';
  } else {
    if (sel.size >= 10) { showToast('Maximum 10 stories per category'); return; }
    sel.add(id);
    el.classList.add('selected-10');
    el.querySelector('.story-check').textContent = '✓';
  }
  const counter = document.getElementById(`sel10-count-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (counter) counter.textContent = `${sel.size}/10 selected`;
  if (sel.size >= 10) setPhase(cat, 1);
  updateCatHeader(cat);
}

function toggleSelect5(cat, id, el) {
  const sel = selected5[cat];
  if (sel.has(id)) {
    sel.delete(id);
    el.classList.remove('selected-5');
    el.querySelector('.story-check').textContent = '';
  } else {
    if (sel.size >= 5) { showToast('Maximum 5 stories per category'); return; }
    sel.add(id);
    el.classList.add('selected-5');
    el.querySelector('.story-check').textContent = '✓';
  }
  const counter = document.getElementById(`sel5-count-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (counter) counter.textContent = `${sel.size}/5 selected`;
  if (sel.size >= 5) setPhase(cat, 2);
  updateCatHeader(cat);
}

async function generateSummaries(cat) {
  const sel5ids = Array.from(selected5[cat] || []);
  if (sel5ids.length < 5) { showToast('Please select 5 stories first'); return; }
  const btn = document.getElementById(`gen-btn-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (btn) { btn.disabled = true; btn.textContent = '🤖 Generating... (~2 min)'; }
  showToast('Generating voice summaries... Please wait');
  try {
    const res = await apiPost(`${API}/api/admin/generate-voices`, { story_ids: sel5ids });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    data.stories.forEach(s => {
      const story = (allStories[cat] || []).find(st => st.id === s.id);
      if (story) story.voices = s.voices;
    });
    showToast('✅ Voice summaries generated!');
    setPhase(cat, 3);
  } catch (err) {
    showToast(`❌ ${err.message}`);
    if (btn) { btn.disabled = false; btn.textContent = '🤖 Generate Voice Summaries →'; }
  }
}

function approveVoice(storyId, voiceKey, cat) {
  if (!approvedVoices[storyId]) approvedVoices[storyId] = {};
  approvedVoices[storyId][voiceKey] = true;
  setPhase(cat, 3);
  const allDone = isStoryFullyApproved(storyId);
  if (allDone) showToast('✅ All voices approved for this story!');
}

function showFeedback(storyId, voiceKey) {
  const fb = document.getElementById(`feedback-${storyId}-${voiceKey}`);
  if (fb) fb.style.display = fb.style.display === 'none' ? 'block' : 'none';
}

async function regenerateWithFeedback(storyId, voiceKey, cat) {
  const feedbackInput = document.getElementById(`feedback-input-${storyId}-${voiceKey}`);
  const feedback = feedbackInput ? feedbackInput.value : '';
  showToast('🔄 Regenerating...');
  try {
    const res = await apiPost(`${API}/api/admin/regenerate-voice`, { story_id: storyId, voice_key: voiceKey, feedback });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    const textarea = document.getElementById(`voice-text-${storyId}-${voiceKey}`);
    if (textarea) textarea.value = data.new_voice;
    const story = Object.values(allStories).flat().find(s => s.id === storyId);
    if (story) { if (!story.voices) story.voices = {}; story.voices[voiceKey] = data.new_voice; }
    showToast('✅ Regenerated!');
    const fb = document.getElementById(`feedback-${storyId}-${voiceKey}`);
    if (fb) fb.style.display = 'none';
  } catch (err) { showToast(`❌ ${err.message}`); }
}

async function saveVoiceEdit(storyId, voiceKey) {
  const textarea = document.getElementById(`voice-text-${storyId}-${voiceKey}`);
  if (!textarea) return;
  try {
    await apiPost(`${API}/api/admin/save-voice`, { story_id: storyId, voice_key: voiceKey, voice_text: textarea.value });
    const story = Object.values(allStories).flat().find(s => s.id === storyId);
    if (story) { if (!story.voices) story.voices = {}; story.voices[voiceKey] = textarea.value; }
    showToast('💾 Saved!');
  } catch (err) { showToast(`❌ ${err.message}`); }
}

function markEdited(storyId, voiceKey) {
  if (approvedVoices[storyId]) delete approvedVoices[storyId][voiceKey];
}

function isStoryFullyApproved(storyId) {
  const keys = ['student','professional'];
  return keys.every(k => approvedVoices[storyId] && approvedVoices[storyId][k]);
}

function markCatDone(cat) {
  catDone[cat] = true;
  updateProgress();
  showToast(`✅ ${cat} done!`);
  const body = document.getElementById(`cat-body-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (body) body.style.display = 'none';
  // Update header to show done badge
  renderAllCategories();
}

function updateCatHeader(cat) {
  const sel10 = selected10[cat] ? selected10[cat].size : 0;
  const sel5 = selected5[cat] ? selected5[cat].size : 0;
  const el = document.getElementById(`cat-prog-${cat.replace(/[^a-z0-9]/gi,'_')}`);
  if (el) el.textContent = `${sel10}/10 selected · ${sel5}/5 final`;
}

function updateProgress() {
  const doneCount = Object.values(catDone).filter(Boolean).length;
  document.getElementById('progress-pill').textContent = `${doneCount} / 11 categories done`;
  const btn = document.getElementById('submit-btn');
  if (doneCount >= 11) {
    btn.disabled = false;
    btn.style.background = 'var(--green)';
  } else {
    btn.disabled = true;
    btn.style.background = 'var(--blue)';
  }
}

async function submitAll() {
  if (!confirm('Publish today\'s brief to website and send emails to all subscribers?')) return;
  const approvedIds = [];
  CATEGORIES.forEach(cat => { if (selected5[cat]) selected5[cat].forEach(id => approvedIds.push(id)); });
  if (approvedIds.length === 0) { showToast('No stories selected'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '🚀 Publishing...';
  try {
    const today = new Date().toISOString().split('T')[0];
    const res = await apiPost(`${API}/api/admin/submit`, { approved_ids: approvedIds, date: today });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    document.getElementById('undo-bar').classList.add('show');
    btn.textContent = '✅ Published!';
    showToast(`✅ ${data.stories_published} stories published! Emails sent.`);
    startUndoCountdown(data.can_undo_until);
  } catch (err) {
    showToast(`❌ ${err.message}`);
    btn.disabled = false; btn.textContent = '🚀 Submit & Publish';
  }
}

async function undoSubmit() {
  if (!confirm('Undo submission?')) return;
  try {
    const today = new Date().toISOString().split('T')[0];
    const res = await apiPost(`${API}/api/admin/undo-submit`, { date: today });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    document.getElementById('undo-bar').classList.remove('show');
    const btn = document.getElementById('submit-btn');
    btn.disabled = false; btn.textContent = '🚀 Submit & Publish';
    showToast('↩️ Undone.');
    clearInterval(undoTimer);
  } catch (err) { showToast(`❌ ${err.message}`); }
}

function startUndoCountdown(undoUntil) {
  const deadline = new Date(undoUntil);
  undoTimer = setInterval(() => {
    const remaining = Math.max(0, deadline - new Date());
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    const el = document.getElementById('undo-timer');
    if (el) el.textContent = `Undo available for ${mins}:${secs.toString().padStart(2,'0')}`;
    if (remaining <= 0) { clearInterval(undoTimer); document.getElementById('undo-bar').classList.remove('show'); }
  }, 1000);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}
</script>
</body>
</html>
