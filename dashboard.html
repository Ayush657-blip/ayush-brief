<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayush's Brief — Intelligence Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0a0908;--gold:#c9a84c;--gold-light:#e8c96d;
  --surface:#0f0d0b;--card:#141210;--card2:#1a1714;
  --ai:#3b7dd8;--world:#4caf7d;--fmcg:#e07b39;--india:#9b59b6;
}
body{background:var(--surface);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;color:#fff;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
.loader{width:40px;height:40px;border:3px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.4);}

/* HEADER */
.header{border-bottom:1px solid rgba(255,255,255,0.06);padding:0 24px;display:flex;align-items:center;height:56px;gap:20px;position:sticky;top:0;background:rgba(10,9,8,0.96);backdrop-filter:blur(12px);z-index:100;}
.brand{font-family:Georgia,serif;font-size:18px;font-weight:bold;color:#fff;}
.brand span{color:var(--gold);}
.date-badge{margin-left:auto;font-family:'Courier New',monospace;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.08em;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4caf7d;box-shadow:0 0 6px #4caf7d;}

/* STATS BAR */
.stats-bar{display:flex;border-bottom:1px solid rgba(255,255,255,0.05);padding:0 24px;}
.stat{padding:10px 20px 10px 0;margin-right:20px;border-right:1px solid rgba(255,255,255,0.05);}
.stat:last-child{border-right:none;}
.stat-val{font-family:Georgia,serif;font-size:20px;font-weight:bold;color:var(--gold);}
.stat-lbl{font-family:'Courier New',monospace;font-size:8px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.15em;margin-top:2px;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid rgba(255,255,255,0.05);}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.grid{grid-template-columns:1fr;}}

.col{border-right:1px solid rgba(255,255,255,0.05);}
.col:last-child{border-right:none;}

.col-header{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:8px;position:sticky;top:56px;background:rgba(12,10,9,0.98);z-index:10;}
.col-accent{width:3px;height:16px;border-radius:2px;}
.col-name{font-family:'Courier New',monospace;font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.6);font-weight:500;}
.col-count{margin-left:auto;font-family:'Courier New',monospace;font-size:8px;color:rgba(255,255,255,0.2);}

/* CARD */
.card{margin:8px;background:var(--card);border:1px solid rgba(255,255,255,0.05);padding:12px;cursor:pointer;transition:all 0.2s;border-radius:2px;}
.card:hover{background:var(--card2);border-color:rgba(201,168,76,0.25);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.card-num{font-family:'Courier New',monospace;font-size:9px;color:rgba(255,255,255,0.2);margin-bottom:7px;}
.card-title{font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);line-height:1.4;margin-bottom:7px;}
.card-preview{font-size:11px;color:rgba(255,255,255,0.3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,0.04);}
.card-why{font-size:10px;color:var(--gold);opacity:0;transition:opacity 0.2s;}
.card:hover .card-why{opacity:1;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:#141210;border:1px solid rgba(201,168,76,0.2);max-width:540px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.8);border-top:2px solid var(--gold);}
.modal-header{padding:22px 24px 14px;border-bottom:1px solid rgba(255,255,255,0.06);}
.modal-cat{font-family:'Courier New',monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.modal-title{font-family:Georgia,serif;font-size:19px;font-weight:bold;color:#fff;line-height:1.3;}
.modal-body{padding:18px 24px;}
.modal-summary{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.7;margin-bottom:18px;}
.btl-label{font-family:'Courier New',monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.btl-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.btl-list li{display:flex;gap:10px;font-size:12.5px;color:rgba(255,255,255,0.75);line-height:1.55;}
.btl-list li::before{content:'—';color:var(--gold);flex-shrink:0;}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,0.12);color:#fff;}

/* EMPTY STATE */
.empty{padding:40px;text-align:center;color:rgba(255,255,255,0.2);font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.1em;}

/* FOOTER */
.footer{padding:14px 24px;border-top:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;}
.footer-brand{font-family:Georgia,serif;font-size:13px;color:rgba(255,255,255,0.25);}
.footer-meta{font-family:'Courier New',monospace;font-size:9px;color:rgba(255,255,255,0.15);letter-spacing:0.08em;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.2);border-radius:2px;}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
  <p>Loading today's intelligence...</p>
</div>

<!-- HEADER -->
<div class="header">
  <div class="brand">Ayush's <span>Brief.</span></div>
  <div class="date-badge" id="header-date">Loading...</div>
  <div class="live-dot" title="Live"></div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="stat-stories">—</div><div class="stat-lbl">Stories</div></div>
  <div class="stat"><div class="stat-val">4</div><div class="stat-lbl">Categories</div></div>
  <div class="stat"><div class="stat-val">24h</div><div class="stat-lbl">News window</div></div>
  <div class="stat"><div class="stat-val">06:00</div><div class="stat-lbl">Generated IST</div></div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-brand">Ayush's Brief.</div>
  <div class="footer-meta" id="footer-meta">Loading...</div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-header">
      <div class="modal-cat" id="m-cat"></div>
      <div class="modal-title" id="m-title"></div>
    </div>
    <div class="modal-body">
      <div class="modal-summary" id="m-summary"></div>
      <div class="btl-label">The Bottom Line</div>
      <ul class="btl-list" id="m-btl"></ul>
    </div>
  </div>
</div>

<script>
const COLORS = {
  "AI & Technology": "var(--ai)",
  "World News": "var(--world)",
  "FMCG & Consumer": "var(--fmcg)",
  "India Business": "var(--india)"
};

let globalData = null;

async function loadData() {
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error('No data yet');
    const data = await res.json();
    globalData = data;
    renderDashboard(data);
  } catch(e) {
    // Show placeholder
    renderPlaceholder();
  }
  document.getElementById('loading').style.display = 'none';
}

function renderDashboard(data) {
  const today = new Date().toLocaleDateString('en-IN', {
    weekday:'long', year:'numeric', month:'long', day:'numeric',
    timeZone:'Asia/Kolkata'
  });
  document.getElementById('header-date').textContent = today + ' · 06:00 IST';
  document.getElementById('stat-stories').textContent = data.totalStories || 0;
  document.getElementById('footer-meta').textContent = 'Auto-generated · 06:00 IST · Groq API + Resend + GitHub Actions';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  (data.sections || []).forEach(section => {
    const col = document.createElement('div');
    col.className = 'col';
    const color = COLORS[section.category] || '#888';

    col.innerHTML = `
      <div class="col-header">
        <div class="col-accent" style="background:${color}"></div>
        <div class="col-name">${section.category}</div>
        <div class="col-count">${(section.articles||[]).length}</div>
      </div>`;

    (section.articles || []).forEach((article, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-num">${String(i+1).padStart(2,'0')}</div>
        <div class="card-title">${article.title||''}</div>
        <div class="card-preview">${article.summary||article.description||''}</div>
        <div class="card-footer">
          <span style="font-family:'Courier New',monospace;font-size:8px;color:rgba(255,255,255,0.2);text-transform:uppercase;">${article.source||''}</span>
          <span class="card-why">→</span>
        </div>`;
      card.onclick = () => openModal(section.category, article, color);
      col.appendChild(card);
    });

    grid.appendChild(col);
  });
}

function renderPlaceholder() {
  const today = new Date().toLocaleDateString('en-IN', {
    weekday:'long', year:'numeric', month:'long', day:'numeric',
    timeZone:'Asia/Kolkata'
  });
  document.getElementById('header-date').textContent = today + ' · 06:00 IST';
  document.getElementById('stat-stories').textContent = '—';
  document.getElementById('footer-meta').textContent = 'Next edition at 06:00 IST tomorrow';

  const grid = document.getElementById('grid');
  const cats = ['AI & Technology','World News','FMCG & Consumer','India Business'];
  grid.innerHTML = cats.map(cat => `
    <div class="col">
      <div class="col-header">
        <div class="col-accent" style="background:${COLORS[cat]}"></div>
        <div class="col-name">${cat}</div>
      </div>
      <div class="empty">Next edition at 6:00 AM IST</div>
    </div>`).join('');
}

function openModal(category, article, color) {
  document.getElementById('m-cat').textContent = category;
  document.getElementById('m-cat').style.color = color;
  document.getElementById('m-title').textContent = article.title || '';
  document.getElementById('m-summary').textContent = article.summary || article.description || '';
  const btl = document.getElementById('m-btl');
  btl.innerHTML = '';
  const insights = article.why ? [article.why] : ['Read the full article for context'];
  insights.forEach(insight => {
    const li = document.createElement('li');
    li.textContent = insight;
    btl.appendChild(li);
  });
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('overlay').addEventListener('click', e => { if(e.target===document.getElementById('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

loadData();
</script>
</body>
</html>
